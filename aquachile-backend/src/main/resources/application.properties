spring.application.name=aquachile-backend
server.port=8080

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
app.upload.dir=${UPLOAD_DIR:./uploads}
app.frontend-url=${APP_BASE_URL:http://localhost:5173}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${RESEND_FROM:AquaChile <onboarding@resend.dev>}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB


# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aquachile_dev}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Solo para la primera ejecución; después retirar ADMIN_INITIAL_PASSWORD
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# AI optional integration; a real key is required to run it
app.ai.api-key=${GROQ_API_KEY:}
app.ai.model=${GROQ_MODEL:openai/gpt-oss-20b}
